[project]
name = "big_points"
version = "0.1.0"
description = "a dagster project to search bing"
requires-python = ">=3.13,<3.15"
authors = [
    {name = "Jaime Shafer", email = "jaimeshafer@gmail.com"}
]
readme = "README.md"

[tool.poetry]
packages = [
    {include = "dags"},
]

[tool.poetry.dependencies]
selenium = "^4.47.0"
wonderwords = "^3.0.1"
dagster-webserver = "^1.13.16"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[project.scripts]
local = "main:dag_local"
cookies = "main:save_cookies"