services:
  dagster:
    build: .
    container_name: bing-points-dagster
    ports:
      - "30303:30303"
    volumes:
      - ./data:/app/data
      - ./dagster_home:/app/dagster_home
    environment:
      DAGSTER_HOME: /app/dagster_home
      SELENIUM_REMOTE_URL: http://selenium:4444/wd/hub
    depends_on:
      - selenium
    restart: unless-stopped

  selenium:
    image: chainguard/selenium-standalone-chromium:latest
    container_name: bing-points-selenium
    shm_size: "1gb"
    restart: unless-stopped